<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navigation and Linking</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
        }

        nav {
            background-color: #0077cc;
            padding: 15px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-right: 20px;
            font-weight: bold;
        }

        section {
            padding: 40px;
            height: 250px;
        }

        #home {
            background-color: #f4f4f4;
        }

        #events {
            background-color: #e8f0ff;
        }

        #contact {
            background-color: #f9e8ff;
        }
    </style>
</head>

<body>

    <!-- Navigation Section -->
    <nav>
        <a href="#home">Home</a>
        <a href="#events">Events</a>
        <a href="#contact">Contact</a>

        <!-- External Help Link -->
        <a href="help.html" target="_blank">Help</a>
    </nav>

    <!-- Home Section -->
    <section id="home">
        <h2>Home Section</h2>
        <p>Welcome to the Local Community Event Portal.</p>
    </section>

    <!-- Events Section -->
    <section id="events">
        <h2>Events Section</h2>
        <p>Here you can view upcoming community events.</p>
    </section>

    <!-- Contact Section -->
    <section id="contact">
        <h2>Contact Section</h2>
        <p>Contact us for more information about events.</p>
    </section>

</body>

</html>
