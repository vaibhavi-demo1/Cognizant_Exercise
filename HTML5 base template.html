<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Community Event Portal</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }

        header, nav, main, footer {
            padding: 20px;
            margin: 10px;
        }

        header {
            background-color: #0077cc;
            color: white;
            text-align: center;
        }

        nav {
            background-color: #e0e0e0;
        }

        main {
            background-color: white;
            min-height: 300px;
        }

        footer {
            background-color: #333;
            color: white;
            text-align: center;
        }
    </style>
</head>

<body>

    <!-- Header Section -->
    <header>
        <h1>Local Community Event Portal</h1>
        <p>Welcome to the community events website</p>
    </header>

    <!-- Navigation Section -->
    <nav>
        <a href="#">Home</a> |
        <a href="#">Events</a> |
        <a href="#">Contact</a>
    </nav>

    <!-- Main Section -->
    <main>
        <h2>Upcoming Events</h2>
        <p>This portal helps residents register for events and access community services.</p>
    </main>

    <!-- Footer Section -->
    <footer>
        <p>&copy; 2026 Local Community Portal</p>
    </footer>

</body>

</html>
