<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome Banner</title>

    <style>
     
        #welcomeBanner {
            background-color: blue;
            color: white;
            padding: 20px;
            text-align: center;
        }

   
        .highlight {
            background-color: yellow;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div id="welcomeBanner">

        <h1>Welcome User</h1>

        <p class="highlight">
            Welcome to Local Community Event Portal
        </p>

        <p>
            Special Offer:
            <span style="color:red; font-weight:bold;">
                Free Entry for First 50 Users!
            </span>
        </p>

    </div>

</body>

</html>
